{% extends "base.html" %}

{% block content %}
<div class="login-form">
    <h2>Вход в систему</h2>
    
    {% if form.errors %}
        <p class="error">Неправильное имя пользователя или пароль. Пожалуйста, попробуйте снова.</p>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_username">Имя пользователя:</label>
            {{ form.username }}
        </div>
        
        <div class="form-group">
            <label for="id_password">Пароль:</label>
            {{ form.password }}
        </div>
        
        <div class="form-actions">
            <button type="submit">Войти</button>
            <input type="hidden" name="next" value="{{ next }}" />
        </div>
    </form>

    <div class="links">
        <p>Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрируйтесь</a></p>
    </div>
</div>
{% endblock %}
